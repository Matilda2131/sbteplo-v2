services:
  - type: web
    name: mimo-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python notify_server.py
    envVars:
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: DEEPSEEK_KEY
        sync: false
